.stat{min-width:0}dialog .statgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.stat .label{font-size:14px;color:var(--muted)}.positive{color:var(--green)}.negative{color:var(--red)}.training-top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px}.progress{height:6px;background:var(--raised);border-radius:4px;overflow:hidden;margin-bottom:24px}.progress div{height:100%;background:var(--blue)}.patient-instruction{text-align:center;margin-bottom:16px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:20px;max-width:900px;margin:0 auto}.choice{position:relative;padding:12px;border:2px solid var(--control);background:#fff;min-height:200px;height:clamp(200px,29vh,290px);border-radius:12px;overflow:hidden}.choice:hover:not(:disabled){background:#fff;border-color:var(--blue)}.choice img{width:100%;height:100%;object-fit:contain;display:block}.choice.wrong,.choice.wrong:hover:not(:disabled){border:4px solid var(--red)}.choice.correct{border:4px solid var(--green)}.choice:disabled{opacity:1}.choice .badge{position:absolute;top:8px;right:8px;color:var(--red);background:var(--redsoft);font-size:14px;border-radius:6px;padding:3px 8px}.choice.correct .badge{color:var(--green);background:var(--greensoft)}.feedback{text-align:center;min-height:50px;padding:10px;font-size:19px;font-weight:600}.feedback.error{color:var(--red)}.feedback.success{color:var(--green)}.tools{max-width:900px;margin:16px auto 0;border-top:1px solid var(--line);padding-top:16px}.tools summary{cursor:pointer;min-height:44px;color:var(--muted);font-size:14px;padding:10px 0}.hintbox{border:1px dashed var(--line);padding:16px;margin-top:12px;border-radius:8px}.secret{font-size:26px;font-weight:700;min-height:44px;user-select:none}.table-scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:13px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{background:var(--soft);font-weight:600;white-space:nowrap}td{min-width:65px}td.word{overflow-wrap:anywhere;max-width:180px}.alert{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:12px 20px;border-radius:8px;z-index:20;max-width:calc(100% - 32px);box-shadow:0 4px 16px #0002;font-size:14px}.persist-error{padding:16px;background:var(--redsoft);color:var(--red);border-bottom:1px solid var(--red)}dialog{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:12px;width:620px;max-width:calc(100% - 32px);max-height:90vh;padding:0}dialog::backdrop{background:#0006}.dialog-body{padding:24px}.dialog-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}dialog .actions{display:flex;justify-content:flex-end;gap:12px;margin-top:24px}.fineprint{margin-top:32px;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);font-size:14px}.sr{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}#busy{font-size:14px;color:var(--muted)}.recordcard{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;border:1px solid var(--line);padding:20px;border-radius:8px}.recordcard h3{overflow-wrap:anywhere}.hidden{display:none!important}

<body>
<div id="storage-error" class="persist-error hidden" role="alert"></div>
<header class="top"><div class="wrap"><div class="topbar"><div class="brand"><span class="mark" aria-hidden="true">聽</span><div><strong>聽・選</strong><small>圖片理解訓練</small></div></div><span class="local">本機儲存 · 毋須登入</span></div><nav aria-label="主選單" id="nav"><button data-view="setup" aria-current="page">開始訓練</button><button data-view="library">圖片字庫</button><button data-view="records">訓練紀錄</button><button data-view="help">使用說明</button></nav></div></header>
<main class="wrap" id="app"><div class="empty">正在載入本機資料…</div></main>
<dialog id="word-dialog" aria-labelledby="word-title"><form id="word-form"><div class="dialog-body"><div class="dialog-head"><h2 id="word-title">新增字詞</h2><button type="button" id="close-word" aria-label="關閉">×</button></div><div class="field"><label for="word-name">字詞名稱</label><input id="word-name" type="text" maxlength="50" required autocomplete="off" placeholder="例如：蘋果"><small>名稱只用於設定、治療師提示和紀錄，不會顯示在患者的圖片上。</small></div><div class="field"><label for="word-category">字詞分類</label><select id="word-category"></select><small>每個字詞可指定一個分類；未選擇則保留為「未分類」。可先在字庫的「管理分類」新增分類。</small></div><div class="field"><label for="word-files">上載相關圖片</label><input id="word-files" type="file" accept="image/jpeg,image/png,image/webp" multiple><small>可一次選多張 JPG、PNG 或 WebP。每張上限 15 MB；圖片會縮小至最長邊 1000 像素，並保留比例。</small></div><div id="busy" role="status"></div><div id="word-photos" class="thumbs mt16"></div><p id="word-error" class="negative mt16" role="alert"></p><div class="actions"><button type="button" id="cancel-word">取消</button><button type="submit" class="primary" id="save-word">儲存字詞</button></div></div></form></dialog>
<dialog id="record-dialog" aria-labelledby="record-title"><div class="dialog-body"><div class="dialog-head"><h2 id="record-title">訓練詳情</h2><button type="button" id="close-record" aria-label="關閉詳情">×</button></div><div id="record-content"></div></div></dialog>
<dialog id="category-dialog" aria-labelledby="category-title"><div class="dialog-body"><div class="dialog-head"><h2 id="category-title">管理分類</h2><button id="close-categories" type="button" aria-label="關閉分類管理">×</button></div><p class="muted smalltext">例如：家居、食物、交通工具。刪除分類不會刪去字詞或圖片。</p><form id="category-form" class="mt16"><label for="category-name">新分類名稱</label><div class="row mt8"><input type="text" id="category-name" required maxlength="40" placeholder="例如：家居" style="flex:1;min-width:150px"><button type="submit" class="primary">新增分類</button></div><p id="category-error" class="negative smalltext mt8" role="alert"></p></form><div id="category-list" class="mt24"></div></div></dialog>
<div id="toast" class="alert hidden" role="status"></div>
<script>
'use strict';
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2);
let db, state={words:[],sessions:[],categories:[]}, view='setup', active=null, trial=null, controls=null, advanceTimer=null, locked=false, draft=null, processing=false;
let libraryFilter='all',setupFilter='all';
let selectedTargets=new Set(),selectedDistractors=new Set(), setupValues={code:'',n:12,mode:'random',countType:'total',repeats:5}, saveFailed=false;
const shuffle=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}, pick=a=>a[Math.floor(Math.random()*a.length)];
const pct=(a,b)=>b?`${(100*a/b).toFixed(1)}%`:'—';
const fmt=iso=>new Date(iso).toLocaleString('zh-HK',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
function toast(s){$('#toast').textContent=s;$('#toast').classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').classList.add('hidden'),4000)}
function storageError(){saveFailed=true;$('#storage-error').textContent='本機儲存失敗（可能是空間不足或瀏覽器限制）。請先匯出完整備份；未成功儲存的資料在關閉後可能遺失。';$('#storage-error').classList.remove('hidden')}
function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open('listen-choose-zh-v1',1);r.onupgradeneeded=()=>r.result.createObjectStore('data');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function readState(){return new Promise((resolve,reject)=>{const r=db.transaction('data').objectStore('data').get('state');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function save(){if(!db){storageError();return false}try{await new Promise((resolve,reject)=>{const tx=db.transaction('data','readwrite');tx.objectStore('data').put(state,'state');tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error)});saveFailed=false;$('#storage-error').classList.add('hidden');return true}catch(e){storageError();return false}}
function setView(v){view=v;$('#nav').classList.toggle('hidden',!!active);$('#nav').querySelectorAll('button').forEach(b=>{if(b.dataset.view===v)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});render();window.scrollTo(0,0)}
$('#nav').addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(b&&!active)setView(b.dataset.view)});
function render(){if(active){renderTraining();return}({setup:renderSetup,library:renderLibrary,records:renderRecords,help:renderHelp}[view]||renderSetup)()}

function normalizeState(data){data.categories=Array.isArray(data.categories)?data.categories:[];data.words.forEach(w=>{if(!data.categories.some(c=>c.id===w.categoryId))w.categoryId=null});return data}
function categoryName(w){return state.categories.find(c=>c.id===w.categoryId)?.name||'未分類'}
function categoryOptions(value='all',filter=true){return (filter?`<option value="all" ${value==='all'?'selected':''}>所有分類</option><option value="uncategorized" ${value==='uncategorized'?'selected':''}>未分類</option>`:`<option value="">未分類</option>`)+state.categories.map(c=>`<option value="${esc(c.id)}" ${value===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}
function matchesCategory(w,value){return value==='all'||(value==='uncategorized'?!w.categoryId:w.categoryId===value)}
function filterMarkup(id,value,setup=false){return `<div class="filterbar"><div class="filter-field"><label for="${id}">按字詞分類篩選</label><select id="${id}">${categoryOptions(value)}</select></div>${!setup?'<button id="manage-categories">管理分類</button>':''}${setup?'<p class="filter-note">切換分類不會取消已選字詞；已選的目標字和干擾字仍會顯示，可跨分類配搭。</p>':''}</div>`}
function openCategories(){renderCategories();$('#category-dialog').showModal()}
function renderCategories(){$('#category-list').innerHTML=state.categories.length?state.categories.map(c=>`<div class="categoryrow"><div><strong>${esc(c.name)}</strong><span class="muted smalltext"> · ${state.words.filter(w=>w.categoryId===c.id).length} 個字詞</span></div><div class="row gap8"><button class="small rename-category" data-id="${esc(c.id)}" type="button">改名</button><button class="small danger remove-category" data-id="${esc(c.id)}" type="button">刪除</button></div></div>`).join(''):'<p class="muted">尚未建立分類；原有字詞已保留在「未分類」。</p>';document.querySelectorAll('.rename-category').forEach(b=>b.onclick=async()=>{const c=state.categories.find(x=>x.id===b.dataset.id),v=prompt('新分類名稱（最多 40 字）',c.name);if(v===null)return;const name=v.trim();if(!validCategoryName(name,c.id))return;c.name=name;await save();renderCategories();renderLibrary()});document.querySelectorAll('.remove-category').forEach(b=>b.onclick=async()=>{const c=state.categories.find(x=>x.id===b.dataset.id);if(!confirm(`刪除「${c.name}」分類？字詞及圖片不會刪除，會改為「未分類」。`))return;state.words.forEach(w=>{if(w.categoryId===c.id)w.categoryId=null});state.categories=state.categories.filter(x=>x.id!==c.id);if(libraryFilter===c.id)libraryFilter='all';if(setupFilter===c.id)setupFilter='all';await save();renderCategories();renderLibrary()})}
function validCategoryName(name,exclude){if(!name||name.length>40){$('#category-error').textContent='分類名稱須為 1–40 字。';return false}if(state.categories.some(c=>c.id!==exclude&&c.name.localeCompare(name,'zh-HK',{sensitivity:'base'})===0)){$('#category-error').textContent='已有這個分類名稱。';return false}$('#category-error').textContent='';return true}
$('#close-categories').onclick=()=>$('#category-dialog').close();$('#category-form').onsubmit=async e=>{e.preventDefault();const name=$('#category-name').value.trim();if(!validCategoryName(name))return;state.categories.push({id:uid(),name});$('#category-name').value='';renderCategories();renderLibrary();await save()};
function targetAllocation(targets,n,mode,randomise=false){const base=Math.floor(n/3),counts=targets.map(w=>({id:w.id,count:base}));let extras=[0,1,2];if(mode==='random'){const eligible=extras.filter(i=>targets[i].images.length>=base+1);extras=[...(randomise?shuffle(eligible):eligible),...extras.filter(i=>!eligible.includes(i))]}for(let i=0;i<n%3;i++)counts[extras[i]].count++;return counts}
function minimumImages(count,n,mode){return Math.max(count,mode==='block'&&n>1?2:1)}
function fitsImages(targets,distractorCount,n,mode){const counts=targetAllocation(targets,n,mode);return targets.every((w,i)=>w.images.length>=minimumImages(counts[i].count,n,mode))&&distractorCount>=(mode==='block'&&n>1?2:1)}
function imageCapacity(){if(selectedTargets.size!==3||!selectedDistractors.size)return null;const targets=[...selectedTargets].map(id=>state.words.find(w=>w.id===id)),distractors=[...selectedDistractors].map(id=>state.words.find(w=>w.id===id)),distractorCount=distractors.reduce((n,w)=>n+w.images.length,0);let max=0;for(let n=1;n<=100;n++){if(setupValues.countType==='perTarget'&&n%3)continue;if(fitsImages(targets,distractorCount,n,setupValues.mode))max=n}return{targets,distractors,distractorCount,max}}

function compressImage(file){return new Promise((resolve,reject)=>{if(!['image/jpeg','image/png','image/webp'].includes(file.type))return reject(new Error('只支援 JPG、PNG 或 WebP。'));if(file.size>15*1024*1024)return reject(new Error('每張圖片上限為 15 MB。'));const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{try{if(!img.width||!img.height)throw Error('圖片尺寸無效。');const ratio=Math.min(1,1000/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*ratio));c.height=Math.max(1,Math.round(img.height*ratio));const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);resolve({id:uid(),name:file.name,data:c.toDataURL('image/jpeg',.88)})}catch(e){reject(e)}finally{URL.revokeObjectURL(url)}};img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('無法讀取圖片，請換另一張。'))};img.src=url})}
$('#word-files').addEventListener('change',async e=>{processing=true;$('#save-word').disabled=true;$('#word-error').textContent='';const files=[...e.target.files],errors=[];for(let i=0;i<files.length;i++){$('#busy').textContent=`正在處理 ${i+1} / ${files.length} 張圖片…`;try{const im=await compressImage(files[i]);if(draft.images.some(x=>x.data===im.data)||state.words.some(w=>w.id!==draft.id&&w.images.some(x=>x.data===im.data)))throw Error('這張圖片已存在於字庫，請選用不同圖片。');draft.images.push(im)}catch(err){errors.push(files[i].name+'：'+err.message)}}processing=false;$('#save-word').disabled=false;$('#busy').textContent='';$('#word-error').textContent=errors.join('；');$('#word-files').value='';renderDraft()});

function openControls(){if(!active)return;try{if(controls&&!controls.closed){controls.focus();updateControls();return}controls=window.open('','listenChooseTherapist','width=460,height=600');if(!controls){toast('彈出視窗被封鎖。請允許彈出視窗，或在治療師工具內按住查看目標字。');return}const css=document.querySelector('style').textContent;controls.document.open();controls.document.write('<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>治療師控制台</title><style>'+css+'</style></head><body><main style="padding:28px"><div class="eyebrow">THERAPIST ONLY</div><h2 class="mt8">治療師控制台</h2><p class="notice mt16">請放在患者看不到的位置；不要將此視窗投放到患者螢幕。</p><p class="muted mt32" id="c-progress"></p><p class="muted mt16">請讀出這個目標字</p><div id="c-target" style="font-size:48px;font-weight:700;overflow-wrap:anywhere;margin:12px 0 24px"></div><div class="panel soft" id="c-stats"></div><p class="smalltext muted mt24">患者選對後會自動換題。答錯時繼續讀出同一目標字，容許患者再次選擇。</p></main></body></html>');controls.document.close();updateControls()}catch(e){toast('無法開啟控制台，請使用治療師工具中的提示功能。')}}

function exportAttempts(s){const rows=[['訓練ID','患者代號','題目','目標字','該題第幾次點選','點選字詞','圖片檔名','圖片ID','位置_左上1右上2左下3右下4','正確','點選時間_ISO','本題錯誤總次數','訓練模式']];s.trials.forEach(t=>t.attempts.forEach((a,i)=>rows.push([s.id,s.code,t.index,t.target,i+1,a.choice,t.choices.find(c=>c.imageId===a.imageId)?.imageName||'',a.imageId,a.position,a.correct?'是':'否',a.at,t.attempts.filter(x=>!x.correct).length,modeLabel(s)])));download(csv(rows),`聽選_逐次點選_${stamp()}.csv`,'text/csv;charset=utf-8')}
function exportBackup(){download(JSON.stringify({format:'listen-choose-backup',version:3,exportedAt:new Date().toISOString(),state},null,2),`聽選_完整備份_${stamp()}.json`,'application/json')}
function validateBackup(b){if(b?.format!=='listen-choose-backup'||![1,2,3].includes(b.version)||!Array.isArray(b.state?.words)||!Array.isArray(b.state?.sessions))throw Error('不是支援的聽・選備份檔。');const string=s=>typeof s==='string',validDate=s=>string(s)&&!isNaN(Date.parse(s)),unique=a=>new Set(a).size===a.length;const ids=[],imageData=new Set();for(const w of b.state.words){if(!string(w.id)||!string(w.name)||!w.name.trim()||!Array.isArray(w.images)||!w.images.length)throw Error('字庫內容不完整。');ids.push(w.id);for(const im of w.images)if(!string(im.id)||!string(im.name)||!string(im.data)||!/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(im.data))throw Error('圖片格式無效。');for(const im of w.images){if(imageData.has(im.data))throw Error('字庫含有重複圖片，請先移除重複圖片。');imageData.add(im.data)}}if(!unique(ids))throw Error('字庫 ID 重複。');const sids=[];for(const s of b.state.sessions){if(!string(s.id)||!string(s.code)||!validDate(s.startedAt)||!['completed','stopped','interrupted','active'].includes(s.status)||!Number.isInteger(s.total)||s.total<1||s.total>100||!Array.isArray(s.trials)||!Array.isArray(s.targets)||s.targets.length!==3||!Array.isArray(s.distractors)||!s.distractors.length)throw Error('訓練紀錄格式無效。');if(s.trainingMode!==undefined&&!['block','random'].includes(s.trainingMode))throw Error('訓練模式格式無效。');if(s.countType!==undefined&&!['total','perTarget'].includes(s.countType))throw Error('次數設定格式無效。');if(s.plannedTargetCounts!==undefined&&(!Array.isArray(s.plannedTargetCounts)||s.plannedTargetCounts.length!==3||s.plannedTargetCounts.some(c=>!string(c.id)||!s.targets.some(t=>t.id===c.id)||!Number.isInteger(c.count)||c.count<0)||s.plannedTargetCounts.reduce((n,c)=>n+c.count,0)!==s.total))throw Error('目標字次數格式無效。');sids.push(s.id);for(const w of [...s.targets,...s.distractors])if(!string(w.id)||!string(w.name))throw Error('訓練字詞格式無效。');for(const t of s.trials){if(!Number.isInteger(t.index)||!string(t.target)||!string(t.targetId)||typeof t.completed!=='boolean'||!Array.isArray(t.choices)||t.choices.length!==4||!Array.isArray(t.attempts))throw Error('題目格式無效。');for(const c of t.choices)if(!string(c.wordId)||!string(c.name)||!string(c.imageId)||!string(c.imageName))throw Error('選項格式無效。');for(const a of t.attempts)if(!string(a.choiceId)||!string(a.choice)||!string(a.imageId)||typeof a.correct!=='boolean'||!validDate(a.at)||!Number.isInteger(a.position)||a.position<1||a.position>4)throw Error('點選紀錄格式無效。')}}if(!unique(sids))throw Error('訓練 ID 重複。');if(b.state.categories!==undefined&&!Array.isArray(b.state.categories))throw Error('分類格式無效。');const cats=b.state.categories||[];if(!unique(cats.map(c=>c.id))||cats.some(c=>!string(c.id)||!c.id||!string(c.name)||!c.name.trim()||c.name.length>40))throw Error('分類格式無效。');for(const w of b.state.words)if(w.categoryId!==undefined&&w.categoryId!==null&&(!string(w.categoryId)||!cats.some(c=>c.id===w.categoryId)))throw Error('字詞分類不存在。');return normalizeState(b.state)}
async function importBackup(e){const f=e.target.files[0];if(!f)return;if(f.size>100*1024*1024){toast('備份超過 100 MB，未能匯入。');return}try{const incoming=validateBackup(JSON.parse(await f.text()));if(!confirm(`匯入 ${incoming.words.length} 個字詞及 ${incoming.sessions.length} 次訓練？這會取代目前全部本機資料，建議先匯出備份。`))return;state=incoming;libraryFilter='all';setupFilter='all';state.sessions.forEach(s=>{if(s.status==='active'){s.status='interrupted';s.endedAt=s.trials.at(-1)?.attempts.at(-1)?.at||s.startedAt}});selectedTargets.clear();selectedDistractors.clear();const ok=await save();renderRecords();toast(ok?'備份已匯入。':'已載入暫存，但本機儲存失敗；請先保留原備份。')}catch(err){toast('匯入失敗：'+err.message)}}
function renderHelp(){$('#app').innerHTML=`<div class="heading"><div><h1>使用說明</h1><p class="muted">先設定，再把患者畫面交給對方操作。</p></div></div><div class="stack"><section class="panel"><h2>1. 建立字庫與分類</h2><p class="mt16">到「圖片字庫」按「管理分類」新增、改名或刪除分類。編輯字詞可指定一個分類；舊版字詞會保留為「未分類」。新增至少 4 個不同字詞，每個字詞上載一張或多張相關圖片。例如：選「門、凳、梳化」，不論 Block 或 Randomised，設定每字 5 次、共 15 題時，每個目標字各需至少 5 張圖片，而不是各需 15 張。圖片可以重用，數量檢查不等於要求每張圖在該組只出現一次。系統會顯示可用題數並阻止在圖片不足時開始。</p><p>圖片應清晰且意義不重疊；同一張照片不要同時放入不同字詞。本版會防止同一字詞兼作目標及干擾字，並會阻止完全相同的圖片資料重複上載，但不會判斷不同檔案是否拍攝相同內容。</p></section><section class="panel"><h2>2. 訓練模式與次數</h2><p class="mt16"><strong>Block training：</strong>按目標一 → 二 → 三的順序，集中完成各字題目。可在設定預覽用「上移／下移」調整順序。<br><strong>Randomised：</strong>把各字題目隨機混合，直至完成計劃題數；同一目標字可能連續出現。</p><p>可設定「總題數」，或「每個目標字練習次數」。例如每字 5 次，三字共 15 題；Block 會連續做每字 5 題，Randomised 則把每字各 5 題混合。總題數不是 3 的倍數時，Block 多出的題數依目標順序分配，Randomised 將餘額隨機分配給圖片數足夠的目標字，各字最多相差 1 題。答錯重試不另算新題。</p><div class="notice mt16">新增圖片數量下限：兩種模式每個目標字的圖片數，都不得少於該字的計劃訓練次數。例如每字練習 5 次便各需 5 張圖片。Block 同時保留相鄰兩題的四張圖片不重複限制，包括干擾圖及組別交界；兩題或以上時，每個目標字及干擾圖片池至少需 2 張，以符合相鄰限制。Randomised 取消圖片不重複限制，亦容許相鄰題重用相同圖片，干擾圖至少 1 張。</div><p class="mt16">可先按分類篩選，再選定 3 個目標字及至少 1 個其他干擾字。切換分類會保留已選字詞，可跨分類配搭。每題從 3 個目標字各抽一張圖片，另抽一張干擾圖片；抽圖遵守所選模式，四張位置會重新隨機排列。同一題答錯重試不算新一題，維持原圖及位置。新一輪可重新使用圖片。</p><p>點「開啟控制台並開始」後，獨立控制台會顯示這一題要讀出的目標字。請將控制台移到另一個不讓患者看到的螢幕；若彈出視窗被封鎖，請允許開啟，或使用患者畫面下方「治療師工具」內的按住查看提示。</p><p>由治療師親口讀出目標字，網站不會播放語音或錄音。患者點對後約 0.7 秒自動進入下一題；點錯會顯示錯誤並讓患者再次選擇，不限重試次數，也不會自動透露正確圖片。</p></section><section class="panel"><h2>3. 如何計算結果</h2><p class="mt16"><strong>首次作答正確率：</strong>第一次便答對的題數 ÷ 已作答題數。<br><strong>第二／第三次才答對比例：</strong>剛好在第二／第三次點選才答對的題數 ÷ 已作答題數（不是累積正確率）。<br>第四次或以上才答對、已作答但未答對亦另列；尚未作答題不納入分母。<br><strong>所有點選正確率：</strong>正確點選次數 ÷ 全部點選次數。<br><strong>所有點選錯誤率：</strong>錯誤點選次數 ÷ 全部點選次數。</p><div class="info mt16">例子：共 3 題，其中 1 題先錯 2 次再答對，另外 2 題第一次答對。首次正確率為 2/3 = 66.7%，第二次才答對為 0/3 = 0%，第三次才答對為 1/3 = 33.3%；全部點選共 5 次，正確 3/5 = 60%，錯誤 2/5 = 40%；錯誤總次數為 2。</div><p class="mt16">訓練可提早結束。未點選的題目不算答錯，已點選但未答對的題目會保留所有錯誤。重新載入或關閉頁面後，本次訓練會標示為「中斷」，不會自動繼續。</p><p>結果屬自訂訓練紀錄，不是標準化評估。目標字、圖片、干擾程度、提示與作答方式，請由言語治療師按個別需要安排。</p></section><section class="panel"><h2>4. 儲存、備份與私隱</h2><p class="mt16">本網站完全在本機執行，毋須登入；沒有廣告、追蹤程式、外部字型或圖片下載。患者代號、圖片及紀錄儲存在目前瀏覽器的 IndexedDB，本版沒有雲端伺服器或加密登入保護。</p><p>可到「訓練紀錄」匯出統計 CSV、逐次點選 CSV，或包含分類、所有圖片和紀錄的 JSON 完整備份（可匯入舊版 v1 / v2 備份）。匯入備份會取代原有資料；先備份再搬移。CSV 採用 UTF-8 BOM，供 Excel 開啟。</p><p>請使用患者代號，避免上載可辨識個人身份的影像或資料。清除瀏覽器資料、無痕模式、轉用其他瀏覽器、移動本機 HTML 檔或更換網站網址，都可能令原有資料無法讀取；請定期匯出備份，不要把本機資料庫當作正式病歷系統。</p><p>建議使用新版 Chrome 或 Edge。若作為正式服務上線，需另外處理託管、存取權限、私隱及資料保留安排。本檔案本身不會產生公開網站網址。</p></section></div>`}
window.addEventListener('beforeunload',e=>{if(active){e.preventDefault();e.returnValue=''}});
(async()=>{try{db=await openDB();const stored=await readState();if(stored?.words&&stored?.sessions)state=normalizeState(stored);let changed=false;state.sessions.forEach(s=>{if(s.status==='active'){s.status='interrupted';s.endedAt=s.trials.at(-1)?.attempts.at(-1)?.at||s.startedAt;changed=true}});if(changed)await save()}catch(e){storageError()}setView('setup')})();
